name: Remove abandoned frontend packages
on:
  pull_request:
    branches: [main]
jobs:
  prune:
    if: github.head_ref == 'feat/pmo-foundation-audit'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pmo-foundation-audit
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove dependencies no longer referenced by active Vue source
        working-directory: frontend
        run: |
          npm ci
          npm uninstall --no-audit --no-fund @infectoone/vue-ganttastic @xpyjs/gantt-core dayjs html2canvas jordium-gantt-vue3 jspdf lodash pinia read-excel-file vue-toastification vuedraggable gh-pages
          npm audit fix --omit=dev --no-fund || true
          npm run build
          npm audit --omit=dev --audit-level=high
      - name: Commit manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(frontend): remove unreferenced legacy dependencies"
            git push origin HEAD:feat/pmo-foundation-audit
          fi
