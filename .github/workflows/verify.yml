name: PMO Foundation Verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

  backend-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pmo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pmo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pmo_test?schema=public
      JWT_SECRET: local-ci-only-secret-please-do-not-use-outside-tests-123
      BOOTSTRAP_ADMIN_EMAIL: admin@pmo.test
      BOOTSTRAP_ADMIN_PASSWORD: local-test-password-12345
      API_HOST: 127.0.0.1
      API_PORT: 3000
      FRONTEND_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run db:generate
      - run: npx prisma db push --skip-generate
      - run: npm run db:seed
      - run: npm run build
      - name: Verify authenticated organization-scoped API
        run: |
          node dist/main.js > /tmp/pmo-api.log 2>&1 &
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          let ready = false;
          for (let i = 0; i < 30; i++) {
            try {
              const res = await fetch('http://127.0.0.1:3000/api/health');
              if (res.ok) { ready = true; break; }
            } catch {}
            await delay(1000);
          }
          assert.ok(ready, 'API did not start');
          const base = 'http://127.0.0.1:3000/api';
          const unauthorized = await fetch(base + '/projects');
          assert.equal(unauthorized.status, 401);
          const login = await fetch(base + '/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: 'admin@pmo.test', password: 'local-test-password-12345' })
          });
          assert.equal(login.status, 201);
          const loggedIn = await login.json();
          assert.ok(loggedIn.data.accessToken);
          const headers = { Authorization: 'Bearer ' + loggedIn.data.accessToken, 'Content-Type': 'application/json' };
          const created = await fetch(base + '/projects', {
            method: 'POST', headers, body: JSON.stringify({ name: 'Automated Integration Project' })
          });
          assert.equal(created.status, 201);
          const project = (await created.json()).data;
          const list = await fetch(base + '/projects', { headers });
          assert.equal(list.status, 200);
          const projects = (await list.json()).data;
          assert.ok(projects.some((p) => p.id === project.id));
          console.log('API smoke passed: authorization, login, creation, persistence');
          JS
